<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosa</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <a class="brand" href="#/" id="brand"><span class="logo" aria-hidden="true">H</span>Hosa</a>
  <span class="project" id="project"></span>
  <span class="phase" id="phase"></span>
  <form class="gsearch" id="gsearch-form" role="search">
    <label for="gsearch" class="vh">Rechercher dans la KB</label>
    <input id="gsearch" type="search" placeholder="Rechercher un document, une exigence…" autocomplete="off">
    <kbd aria-hidden="true">/</kbd>
  </form>
  <span class="sp"></span>
  <button type="button" class="btn o" id="rename" title="Changer le nom enregistré lors d’une validation"><span id="user-label">Mon nom</span></button>
</header>
<div id="banner" role="status"></div>
<div class="layout">
  <nav id="nav" class="side" aria-label="Menu principal"></nav>
  <main id="main" tabindex="-1"><div id="view"></div></main>
</div>
<footer class="foot"><span id="freshness"></span> <button type="button" id="reload" class="btn o">Relire</button></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="name-dialog">
  <form method="dialog" id="name-form">
    <label for="name-input">Votre nom (demandé une seule fois)</label>
    <input id="name-input" required autocomplete="name">
    <div><button class="btn" value="ok">Enregistrer</button></div>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
