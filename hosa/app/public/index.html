<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hosa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true">h</div>
      <div><b>Hosa</b><small id="root">.hosa/kb</small></div>
    </div>
    <button type="button" class="new-btn" id="new"><span class="plus">+</span>New concept<kbd>N</kbd></button>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="legend" id="legend"></div>
    <button type="button" class="refresh" id="refresh">Reload KB</button>
  </aside>

  <main id="main" tabindex="-1">
    <p id="error" class="error" role="alert" hidden></p>
    <div id="view"></div>
  </main>

  <dialog id="new-dialog">
    <form id="new-form" novalidate>
      <header>
        <h2>New concept</h2>
        <span>Creates a Markdown file with OKF frontmatter.</span>
      </header>
      <div class="fields">
        <div class="pair">
          <label>Folder <input name="bundle" class="mono" list="bundles" placeholder="rules/security" autocomplete="off"><span class="hint" data-for="bundle"></span></label>
          <label>Type <input name="type" list="types" placeholder="Ticket" autocomplete="off"><span class="hint" data-for="type"></span></label>
        </div>
        <datalist id="bundles"></datalist>
        <datalist id="types"></datalist>
        <label>Title <input name="title"><span class="hint" data-for="title"></span></label>
        <label>Slug
          <span class="slug"><span id="prefix">…/</span><input name="slug" placeholder="my-concept" autocomplete="off"><span>.md</span></span>
          <span class="hint" data-for="slug"></span>
        </label>
        <p class="form-error"></p>
      </div>
      <footer>
        <button type="button" class="btn" value="cancel">Cancel</button>
        <button type="submit" class="btn dark">Create and edit</button>
      </footer>
    </form>
  </dialog>

  <p id="toast" role="status" aria-live="polite"></p>
  <script src="/app.js"></script>
</body>
</html>
