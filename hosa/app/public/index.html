<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosa</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <a class="brand" href="#/" id="brand">Hosa</a>
  
  <nav id="nav" aria-label="Menu principal"></nav>
  <details class="more" id="more"><summary>Gestion ▾</summary><div id="more-list"></div></details>
  <span class="sp"></span>
  <button type="button" class="lnk" id="rename" title="Changer le nom enregistré lors d’une validation"><span id="user-label">Mon nom</span></button>
</header>
<div id="banner" role="status"></div>
<main id="main" tabindex="-1"><div id="view"></div></main>
<footer class="foot"><span id="freshness"></span> <button type="button" id="reload" class="btn o">Relire</button></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="name-dialog">
  <form method="dialog" id="name-form">
    <label for="name-input">Votre nom (demandé une seule fois)</label>
    <input id="name-input" required autocomplete="name">
    <div><button class="btn" value="ok">Enregistrer</button></div>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
