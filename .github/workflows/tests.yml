name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: pip install -r hosa/app/requirements.txt
      - name: Hooks
        run: node --test hooks/*.test.js
      - name: App and plugin frontmatter
        working-directory: hosa/app
        run: python -m unittest
      - name: Scripts compile
        run: python -m py_compile skills/*/scripts/*.py
